services:
  - type: web
    name: helix-backend
    env: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    # ────────────────────────────────────────────────────────
    # Required environment variables (set via Render Dashboard → Environment)
    # ────────────────────────────────────────────────────────
    # SECRET_KEY          – JWT signing key. Generate with:
    #                       python -c "import secrets; print(secrets.token_urlsafe(32))"
    # DATABASE_URL        – Neon Postgres connection string (postgres://…)
    #                       Render injects this automatically if linked via
    #                       the Render integration; otherwise paste it manually.
    #
    # ────────────────────────────────────────────────────────
    # Production CORS (REQUIRED when frontend is on a different origin)
    # ────────────────────────────────────────────────────────
    # BACKEND_CORS_ORIGINS – Comma-separated list of allowed frontend origins.
    #   Example: "https://helix-frontend.vercel.app"
    #   Without this, cross-origin sign-up/sign-in from Vercel will fail
    #   with a network error (CORS block).
    #
    #   ⚠️  vite.config.js's dev proxy (/api → localhost:8000) is for local
    #       development ONLY.  In production the frontend MUST use an
    #       absolute VITE_API_BASE_URL and VITE_DATA_SOURCE=api.
    #
    # ────────────────────────────────────────────────────────
    # Media storage (REQUIRED for generated media to survive)
    # ────────────────────────────────────────────────────────
    # R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY,
    # R2_BUCKET, R2_PUBLIC_BASE_URL
    #
    #   This instance's disk is ephemeral. Without these five set
    #   together, generated images and videos are written locally and
    #   destroyed on the next restart or deploy, while the database
    #   keeps pointing at a URL that then 404s.
    #   See "Media storage" in DEVELOPMENT.md.
    #
    # ────────────────────────────────────────────────────────
    # Monitors (REQUIRED for scheduled watches to run at all)
    # ────────────────────────────────────────────────────────
    # CRON_SECRET  – shared secret the scheduler sends as X-Cron-Secret when
    #                calling POST /api/monitors/tick. Unset means the endpoint
    #                rejects everything and no monitor ever runs.
    # APP_BASE_URL – frontend origin, used for links in alerts.
    #
    #   Render Cron Jobs are a paid service type ($1/month minimum), so the
    #   tick is a plain authenticated HTTP endpoint rather than a Render-only
    #   feature. Any scheduler works, including the free one already used to
    #   keep this instance warm. Suggested schedule: every 15 minutes.
    #
    #   As a Render Cron Job:
    #     curl -fsS -X POST -H "X-Cron-Secret: $CRON_SECRET" \
    #       https://helix-intelligence-ai.onrender.com/api/monitors/tick
    #
    # Optional: RESEND_API_KEY + RESEND_FROM enable email alerts. Without
    # them monitors still run and notify in-app.
    #
    # ────────────────────────────────────────────────────────
    # Discovery & Scraping API keys (CRITICAL FOR LIVE SEARCH)
    # ────────────────────────────────────────────────────────
    # METAPI_API_KEY     – Primary ad discovery provider. REQUIRED for keyword ad search.
    # ADYNTEL_API_KEY    – Secondary domain-level ad search fallback.
    # ADYNTEL_EMAIL      – Email registered with Adyntel.
    # GROQ_API_KEY, OPENROUTER_API_KEY, GEMINI_API_KEY,
    # SCRAPEGRAPH_API_KEY, META_ACCESS_TOKEN, BRIGHTDATA_API_KEY,
    # APIFY_API_TOKEN, APIFY_ENABLED
    #
    # ────────────────────────────────────────────────────────
    # Security hardening (added 2026-09)
    # ────────────────────────────────────────────────────────
    # HF_WEBHOOK_SECRET – HMAC secret Higgsfield uses to sign webhook callbacks.
    #   When UNSET, POST /api/webhooks/higgsfield refuses every callback (503)
    #   so unsigned forgeries are never accepted. Required for media jobs to
    #   complete via webhook.
    # RATE_LIMIT_ENABLED – default true. In-memory per-IP limits on auth
    #   endpoints (10/min) and expensive discovery/media job creation (20/min).
    # AUTH_DEV_RESET_RETURN – now DEFAULTS TO FALSE in code. Only set "true"
    #   for local dev. Wire Resend for real reset emails.
    #
    # ────────────────────────────────────────────────────────
    # Password reset (no mail provider is configured yet)
    # ────────────────────────────────────────────────────────
    # ────────────────────────────────────────────────────────
    # Password reset (no mail provider is configured yet)
    # ────────────────────────────────────────────────────────
    # PUBLIC_APP_BASE_URL               – Frontend origin used to build reset
    #                                     links. Defaults to the Vercel app.
    # PASSWORD_RESET_TOKEN_EXPIRE_MINUTES – Lifetime of a reset link (default 30).
    # AUTH_DEV_RESET_RETURN             – "true" returns the reset link in the
    #                                     API response because there is no SMTP
    #                                     yet. See the reset link in Render
    #                                     logs regardless. Set "false" once
    #                                     email delivery exists.
    # ────────────────────────────────────────────────────────
    # Scout · Lead Generation (Scrapling worker)
    # ────────────────────────────────────────────────────────
    # Lead Generation needs a SEPARATE worker process (browsers must not run
    # inside the web service). Deploy backend/workers/scrapling/Dockerfile as a
    # Background Worker on Render, or run it anywhere that can reach this DB.
    #
    #   SCRAPLING_WORKER_ENABLED=true   enables enqueue + worker heartbeat
    #   SCRAPLING_DEFAULT_ENGINE=stealth
    #   SCRAPLING_ROBOTS_OBEY=true      default ON (audited when off)
    #   SCRAPLING_PROXY_LIST=           optional proxies (newline/comma)
    #   SCRAPLING_CHECKPOINT_DIR=/tmp/helix-leadgen-checkpoints  (use a disk!)
    #   SCRAPLING_WORKER_URL=           optional health ping target
    #
    # While SCRAPLING_WORKER_ENABLED is false, POST /api/scout/leadgen/jobs
    # answers 503 worker_offline and the UI shows an honest empty state —
    # nothing is queued and no leads are ever fabricated.
    # ────────────────────────────────────────────────────────
