services:
  - type: web
    name: helix-backend
    env: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    # ────────────────────────────────────────────────────────
    # Required environment variables (set via Render Dashboard → Environment)
    # ────────────────────────────────────────────────────────
    # SECRET_KEY          – JWT signing key. Generate with:
    #                       python -c "import secrets; print(secrets.token_urlsafe(32))"
    # DATABASE_URL        – Neon Postgres connection string (postgres://…)
    #                       Render injects this automatically if linked via
    #                       the Render integration; otherwise paste it manually.
    #
    # ────────────────────────────────────────────────────────
    # Production CORS (REQUIRED when frontend is on a different origin)
    # ────────────────────────────────────────────────────────
    # BACKEND_CORS_ORIGINS – Comma-separated list of allowed frontend origins.
    #   Example: "https://helix-frontend.vercel.app"
    #   Without this, cross-origin sign-up/sign-in from Vercel will fail
    #   with a network error (CORS block).
    #
    #   ⚠️  vite.config.js's dev proxy (/api → localhost:8000) is for local
    #       development ONLY.  In production the frontend MUST use an
    #       absolute VITE_API_BASE_URL and VITE_DATA_SOURCE=api.
    #
    # ────────────────────────────────────────────────────────
    # Optional API keys
    # ────────────────────────────────────────────────────────
    # GROQ_API_KEY, OPENROUTER_API_KEY, GEMINI_API_KEY,
    # SCRAPEGRAPH_API_KEY, BRIGHTDATA_API_KEY,
    #
    # Discover ad-search chain (first source that answers wins):
    #   METAPI_API_KEY      – primary live Ad Library search
    #   ADYNTEL_API_KEY + ADYNTEL_EMAIL – domain-shaped queries only
    #   META_ACCESS_TOKEN   – official ads_archive; REQUIRES the app to hold
    #                         ads_archive authorization, else every query
    #                         returns HTTP 400 subcode 2332002
    #   APIFY_API_TOKEN     – last-resort paid actor
    #   APIFY_ENABLED       – "true" to actually call Apify (default false:
    #                         token present but source skipped)
    # With none of these usable, searches are marked failed and refunded
    # rather than billed as empty results.
    #
    # ────────────────────────────────────────────────────────
    # Password reset (no mail provider is configured yet)
    # ────────────────────────────────────────────────────────
    # PUBLIC_APP_BASE_URL               – Frontend origin used to build reset
    #                                     links. Defaults to the Vercel app.
    # PASSWORD_RESET_TOKEN_EXPIRE_MINUTES – Lifetime of a reset link (default 30).
    # AUTH_DEV_RESET_RETURN             – dev-only convenience that ALSO returns
    #                                     the reset link in the API response. It
    #                                     is forced to "false" below and cannot
    #                                     be re-enabled by a dashboard edit that
    #                                     survives a redeploy, because the
    #                                     response is readable by anyone who can
    #                                     POST an email address. The link stays
    #                                     available in the Render logs.
    #
    # ────────────────────────────────────────────────────────
    # Environment variables managed by this Blueprint
    # ────────────────────────────────────────────────────────
    # Keys with `value:` are overwritten from this file on every deploy — that
    # is what makes the security switches below safe to rely on. Keys marked
    # `sync: false` are declared for documentation only: their values live in
    # the dashboard and a redeploy will not blank them.
    envVars:
      # --- Hard security posture (synced every deploy; do not move to the dashboard) ---
      # Anything other than local/dev/test is treated as production by the app,
      # and production refuses to return reset links even if the flag is flipped.
      - key: ENV
        value: production
      - key: AUTH_DEV_RESET_RETURN
        value: "false"

      # --- Required, valued in the Render dashboard ---
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: BACKEND_CORS_ORIGINS
        sync: false
      # /auth/webhook refuses all traffic while this is unset (it used to accept
      # everything, because the signature was logged and never compared).
      - key: NEON_WEBHOOK_SECRET
        sync: false

      # --- Provider keys ---
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: HF_API_KEY_ID
        sync: false
      - key: HF_API_KEY_SECRET
        sync: false
      - key: APIFY_API_TOKEN
        sync: false
      - key: APIFY_ENABLED
        sync: false
      - key: META_ACCESS_TOKEN
        sync: false
      - key: METAPI_API_KEY
        sync: false
      - key: ADYNTEL_API_KEY
        sync: false
      - key: ADYNTEL_EMAIL
        sync: false
