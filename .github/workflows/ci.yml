name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
        env:
          CI: true

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: helix_test
          POSTGRES_PASSWORD: helix_password
          POSTGRES_DB: helix_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: ci_test_secret_key_not_real_0123456789abcdef
      DATABASE_URL: postgresql+asyncpg://helix_test:helix_password@localhost:5432/helix_test_db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt pyflakes pytest pytest-asyncio
      - name: Undefined name and syntax lint (pyflakes)
        run: |
          python -c "import subprocess, sys; res = subprocess.run(['pyflakes', 'app'], capture_output=True, text=True); errs = [l for l in res.stdout.splitlines() if 'undefined name' in l or 'syntax' in l.lower()]; (print('\n'.join(errs)) or sys.exit(1)) if errs else print('Zero undefined names in app')"
      - name: Compile check (syntax)
        run: python -m compileall -q app
      - name: Alembic migration upgrade & drift check
        run: |
          alembic upgrade head
          alembic check
      - name: Security regression tests
        run: python tests/test_security_regressions.py
      - name: Import smoke test (app boots)
        run: |
          python -c "import app.main; print('FastAPI app imported OK; routes:', len(app.main.app.routes))"
      - name: Run pytest test suite
        run: pytest -v tests

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Gitleaks matches known provider token formats and high-entropy strings.
      # A hand-rolled grep misses rotated prefixes and multiline secrets.
      # v3 (e0c47f4) is pinned by commit SHA: it runs on Node 24. The Node 20
      # v2 action no longer runs on GitHub-hosted runners after 2026-09-16.
      # On pull_request it scans parent-of-first-PR-commit..head (the PR diff),
      # not the full history, and exits 1 when gitleaks reports leaks.
      # This repository is a personal account, so GITLEAKS_LICENSE is not required.
      # Comments and SARIF upload stay off so findings are not published.
      - name: Scan the pull request diff for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.24.3"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_COMMENTS: "false"

  security-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify webhook HMAC, SSRF guard, security headers, and rate limiter
        run: |
          python - <<'PY'
          import re, pathlib
          root = pathlib.Path("backend")

          # 1. AUTH_DEV_RESET_RETURN must default to False (account-takeover guard)
          cfg = (root / "app/core/config.py").read_text()
          assert 'AUTH_DEV_RESET_RETURN", "False"' in cfg, "AUTH_DEV_RESET_RETURN must default to False"

          main = (root / "app/main.py").read_text()
          # 2. Higgsfield provider must stay removed from the app
          import os.path as _op
          assert not _op.exists(root / "app/api/routers/higgsfield.py"), "higgsfield router reappeared"
          assert not _op.exists(root / "app/api/routers/webhooks.py"), "higgsfield webhook reappeared"
          assert "higgsfield" not in main.lower(), "main.py must not mount higgsfield"

          # 3. Rate limiting middleware must exist and be registered
          assert (root / "app/middleware/rate_limit.py").exists(), "rate limiter missing"
          assert "RateLimitMiddleware" in main, "rate limiter not registered in main.py"

          # 4. SSRF protection guard must exist and block cloud metadata IMDS
          sec = (root / "app/services/security_service.py").read_text()
          assert "is_safe_public_url" in sec, "is_safe_public_url missing from security_service"
          assert "169.254.0.0/16" in sec, "IMDS link-local network missing from SSRF guard"

          # 5. Security headers middleware must be registered
          assert "add_security_headers" in main, "security headers middleware missing from main.py"
          assert "X-Frame-Options" in main, "X-Frame-Options missing"
          assert "Strict-Transport-Security" in main, "HSTS missing"

          print("All security smoke checks passed successfully!")
          PY
