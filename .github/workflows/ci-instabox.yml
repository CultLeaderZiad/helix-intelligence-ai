# Trial: the same backend gates as ci.yml, on an InstaBox runner (4 vCPU / 8 GiB).
# Manual only (workflow_dispatch), so it never blocks a PR. If it matches ci.yml,
# switch the `backend` job in ci.yml to `runs-on: instabox-medium`.
# Nothing here holds a secret: DATABASE_URL points at the throwaway service container.
name: CI (InstaBox trial)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-instabox:
    runs-on: instabox-medium
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: helix_test
          POSTGRES_PASSWORD: helix_password
          POSTGRES_DB: helix_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: ci_test_secret_key_not_real_0123456789abcdef
      DATABASE_URL: postgresql+asyncpg://helix_test:helix_password@localhost:5432/helix_test_db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - name: Compile check (syntax)
        run: python -m compileall -q app
      - name: Alembic migration upgrade & drift check
        run: |
          alembic upgrade head
          alembic check
      - name: Migration upgrade, dirty-data, rollback, and transaction regressions
        run: python -m pytest -q tests/test_intelligence_w4_migrations.py tests/test_intelligence_w4_transactions.py
        env:
          W4_DISPOSABLE_DATABASE_URL: postgresql+asyncpg://helix_test:helix_password@localhost:5432/helix_test_db
      - name: Separate disposable rollback database
        env:
          PGPASSWORD: helix_password
          TEST_DATABASE_URL: postgresql+asyncpg://helix_test:helix_password@localhost:5432/helix_w4_rollback
          DATABASE_URL: postgresql+asyncpg://helix_test:helix_password@localhost:5432/helix_w4_rollback
        run: |
          psql -h localhost -U helix_test -d helix_test_db -v ON_ERROR_STOP=1 -c 'CREATE DATABASE helix_w4_rollback'
          python -m alembic upgrade head
          python -m alembic downgrade -1
          python -m alembic upgrade head
          python -m alembic check
      - name: Security regression tests
        run: python tests/test_security_regressions.py
      - name: Import smoke test (app boots)
        run: |
          python -c "import app.main; print('FastAPI app imported OK; routes:', len(app.main.app.routes))"
      - name: Run pytest test suite
        env:
          ENVIRONMENT: test
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
          W4_DISPOSABLE_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: |
          python -m pytest -v tests -W error --junitxml=/tmp/helix-pytest.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          report = ET.parse("/tmp/helix-pytest.xml")
          skipped = sum(int(suite.get("skipped", "0")) for suite in report.iter("testsuite"))
          assert skipped == 0, f"Full backend suite must not skip tests: {skipped} skipped"
          PY
